name: Build Debian Pi 5 Image

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-pi5-image.sh"
      - "scripts/pi5-chroot-setup.sh"
      - ".github/workflows/build-pi5-image.yml"
  workflow_dispatch:
    inputs:
      debian_release:
        description: "Debian release codename"
        required: false
        default: "trixie"
      image_size:
        description: "Image size (e.g. 2G) or auto to fit contents"
        required: false
        default: "auto"
      jlink_modules:
        description: "Comma-separated JDK modules for the minimal JRE"
        required: false
        default: "java.base"
      tedge_packages:
        description: "thin-edge.io apt packages to install"
        required: false
        default: "tedge-minimal"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBIAN_RELEASE: ${{ github.event.inputs.debian_release || 'trixie' }}
      IMAGE_SIZE: ${{ github.event.inputs.image_size || 'auto' }}
      JLINK_MODULES: ${{ github.event.inputs.jlink_modules || 'java.base' }}
      TEDGE_PACKAGES: ${{ github.event.inputs.tedge_packages || 'tedge-minimal' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune -af || true

          echo "After cleanup:"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            parted \
            dosfstools \
            e2fsprogs \
            rsync \
            xz-utils \
            util-linux

      - name: Verify qemu binfmt handler
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          ls /proc/sys/fs/binfmt_misc/ | grep qemu-aarch64

      - name: Build image
        run: sudo -E bash scripts/build-pi5-image.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-pi5-${{ env.DEBIAN_RELEASE }}
          path: build/*.img.xz
          if-no-files-found: error
          retention-days: 14
